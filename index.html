<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>WALLPAPER GALLERY</h1>

<div class="buttons">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('anime')">Anime</button>
    <button onclick="filterImages('aesthetic')">Aesthetic</button>
    <button onclick="filterImages('cat')">Cat</button>
</div>

<div class="gallery">

    <img src="img\img_1.png"
         class="anime image"
         onclick="openLightbox(this)">

    <img src="img\img_2.jpeg"
         class="anime image"
         onclick="openLightbox(this)">

    <img src="img\img_3.jpg"
         class="anime image"
         onclick="openLightbox(this)">

    <img src="img\img_4.jpg"
         class="aesthetic image"
         onclick="openLightbox(this)">

    <img src="img\img_5.png"
         class="aesthetic image"
         onclick="openLightbox(this)">
         
     <img src="img\img_6.jpg"
         class="aesthetic image"
         onclick="openLightbox(this)"> 
         
     <img src="img\img_7.jpg"
         class="cat image"
         onclick="openLightbox(this)">

     <img src="img\img_8.jpg"
         class="cat image"
         onclick="openLightbox(this)">

     <img src="img\img_9.jpg"
         class="cat image"
         onclick="openLightbox(this)">

</div>

<div id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>

    <button class="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightbox-img">

    <button class="next" onclick="changeImage(1)">❯</button>
</div>

<script src="script.js"></script>

</body>
</html>
